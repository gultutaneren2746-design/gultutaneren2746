name: Günlük Shorts üretimi

on:
  schedule:
    - cron: "17 5 * * *"   # her gün 08:17 (TR saati)
  workflow_dispatch:
    inputs:
      count:
        description: "Kaç video üretilsin"
        default: "1"
      topic:
        description: "(İsteğe bağlı) kuyruğu atla, bu konuyu üret"
        default: ""

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Bağımlılıklar
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          npm install
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Video üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python -m factory new "${{ github.event.inputs.topic }}" --build
          else
            python -m factory auto --count "${{ github.event.inputs.count || '1' }}"
          fi
      - name: Videoları yükle
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: |
            output/*/*.mp4
            output/*/*.srt
            output/*/kapak.jpg
            output/*/paylasim.txt
          retention-days: 30
      - name: Senaryoları ve kuyruğu kaydet
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || git commit -m "Yeni senaryolar: $(date +%F)"
          git push
